<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7e8">
<title>今日盲盒</title>
<style>
:root{--bg:#fff7e8;--card:#fffdf8;--ink:#302b25;--accent:#ff8a5b;--accent2:#ffcf5c;--line:#eadfce}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(160deg,#fff7e8,#fff1f5);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:620px;margin:auto;padding:22px 15px 50px}
header{text-align:center;padding:20px 10px 16px} h1{margin:0;font-size:32px} .sub{opacity:.65;margin:8px 0 0}
.card{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:22px;padding:17px;margin:13px 0;box-shadow:0 8px 25px #6b4b2410}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:19px;font-weight:800}
.badge{font-size:12px;background:#fff0d7;padding:5px 9px;border-radius:99px}
.result{margin:13px 0 11px;padding:13px 14px;background:#fff7ed;border-radius:15px;min-height:48px;font-weight:650}
button{border:0;border-radius:14px;padding:12px 15px;font-size:15px;font-weight:750;cursor:pointer}
.draw{width:100%;background:var(--accent);color:white}.draw:active{transform:scale(.98)}
.list{list-style:none;padding:0;margin:10px 0 0}.task{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--line)}
.task:last-child{border:0}.task span{flex:1}.done span{text-decoration:line-through;opacity:.45}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);background:white;padding:0}.done .check{background:var(--accent)}
.del{background:transparent;color:#a99b8c;padding:5px 8px;font-size:20px}
.progress{font-weight:750}.reset{width:100%;margin-top:16px;background:#eee5d8;color:#6b5b4b}
.note{text-align:center;font-size:12px;opacity:.55;margin-top:14px}
.empty{opacity:.48;font-size:14px;padding:4px 0}
</style>
</head>
<body><main>
<header><div style="font-size:48px">🎁</div><h1>今日盲盒</h1><p class="sub">把今天交给一点随机和惊喜</p></header>
<div id="app"></div>
<button class="reset" onclick="resetAll()">🔄 重新开始今天</button>
<p class="note">结果会自动保存在这台手机的浏览器中</p>
</main>
<script>
const pools={
travel:["🚶 步行","🚇 地铁","🚗 开车","🚲 骑车","🚕 打车","🚌 公交","🎲 先掷硬币决定：正面步行，反面乘车"],
outfit:["⚫ 全黑","⚪ 全白","🔵 蓝色系","🔴 红色系","🟢 绿色系","🟡 黄色/暖色系","🟣 紫色系","🎨 随机选两种颜色搭配"],
food:["🍜 吃一种平时很少点的食物","🥐 去一家没去过的咖啡店或甜品店","🎲 打开地图，选附近评分靠前但没去过的店","🍦 买一种从没尝过的零食或饮料","🥡 点一道菜单上排名第二的食物","🍳 用家里现有食材做一个新组合"],
special:["✨ 今天允许自己买一个小惊喜","🎵 随机播放一首没听过的歌，并听完","💌 给一位朋友发一句真诚的夸奖","🌟 完成一件拖了很久的小事","🎁 给自己一个 30 分钟完全放松的时间","🎲 再抽一次任意类别"],
outside:["📸 拍一张今天最像电影画面的照片","🗺️ 随机选一条以前没走过的街，走 10 分钟","🏪 进入一家平时不会进去的店逛一圈","🔎 找到一个有趣的招牌或细节并拍照","☕ 坐下来观察周围 5 分钟，不看手机","😊 主动对一位陌生人微笑或说谢谢","🌳 找一处绿地停留 10 分钟","🎨 找到三种不同颜色的东西并拍照","📍 打开地图，去一个你没去过的附近地点","🧭 出门后第一个路口随机左转或右转","🍬 买一件价格不超过 $5 的小东西","🎧 戴上耳机散步，随机听一首歌","📝 写下今天看到的一个有趣瞬间","🏙️ 拍一张你觉得最能代表今天的照片"],
home:["🧺 整理一个平时很少打开的抽屉或角落","🎬 看一部以前没看过的电影或纪录片","🍳 用家里的食材做一个新组合","📚 随机翻开一本书，读 10 页","🎵 听一张完整专辑或 5 首随机歌曲","🖼️ 整理手机相册，删除至少 10 张不需要的照片","✍️ 写下今天让你开心的三件小事","🧹 用 10 分钟快速整理房间","📞 给一位很久没联系的朋友发消息","🧩 做一个小谜题、拼图或脑筋急转弯","💃 跟着一首歌随便跳或活动身体","🕯️ 关掉主灯，用更舒服的灯光休息 20 分钟","🧠 学一个新词或一个冷知识","🎨 随手画一幅画，不要求好看"]
};
const meta=[
["travel","🚗","出行方式","单选，重复抽会替换"],
["outfit","👕","今日穿搭","单选，重复抽会替换"],
["outside","🌆","出门任务","可连续抽多个"],
["home","🏠","在家任务","可连续抽多个"],
["food","🍜","美食盲盒","单选，重复抽会替换"],
["special","✨","特殊盲盒","单选，重复抽会替换"]
];
let state=JSON.parse(localStorage.getItem("blindbox-v1")||"{}");
function save(){localStorage.setItem("blindbox-v1",JSON.stringify(state))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function draw(key){
 const multi=["outside","home"].includes(key);
 if(multi){state[key]=state[key]||[]; let options=pools[key].filter(x=>!state[key].some(y=>y.text===x)); if(!options.length) options=pools[key]; state[key].push({text:pick(options),done:false,id:Date.now()+Math.random()})}
 else state[key]=pick(pools[key]);
 save();render();
}
function toggle(key,id){let x=state[key].find(x=>x.id===id);x.done=!x.done;save();render()}
function del(key,id){state[key]=state[key].filter(x=>x.id!==id);save();render()}
function render(){
 const app=document.getElementById("app"); app.innerHTML="";
 meta.forEach(([key,icon,title,desc])=>{
  const c=document.createElement("section");c.className="card";
  let content="";
  if(["outside","home"].includes(key)){
   let arr=state[key]||[];
   content=arr.length?`<ul class="list">${arr.map((x,i)=>`<li class="task ${x.done?"done":""}"><button class="check" onclick="toggle('${key}',${x.id})">${x.done?"✓":""}</button><span>${i+1}. ${x.text}</span><button class="del" onclick="del('${key}',${x.id})">×</button></li>`).join("")}</ul>`:`<div class="empty">还没有抽取任务</div>`;
  }else content=`<div class="result">${state[key]||"尚未抽取"}</div>`;
  c.innerHTML=`<div class="top"><div class="title">${icon} ${title}</div><div class="badge">${desc}</div></div>${content}<button class="draw" onclick="draw('${key}')">${["outside","home"].includes(key)?"🎲 再抽一个任务":"🎲 随机抽取"}</button>`;
  app.appendChild(c);
 });
 let all=[...(state.outside||[]),...(state.home||[])],done=all.filter(x=>x.done).length;
 const p=document.createElement("div");p.className="card progress";p.textContent=`✨ 今日任务进度：${done} / ${all.length}`;
 app.appendChild(p);
}
function resetAll(){if(confirm("确定清空今天所有盲盒结果吗？")){state={};save();render()}}
render();
</script></body></html>
